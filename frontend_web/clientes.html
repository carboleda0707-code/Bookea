<!-- frontend_web/clientes.html -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <style>
        html, body, [data-testid="stAppViewContainer"], .stApp {
            background-color: #050612 !important;
            color: #f7f7ff !important;
            font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
        }
        .block-container {
            padding-top: 1rem !important;
            padding-left: 1rem !important;
            padding-right: 1rem !important;
            max-width: 900px !important;
        }
        .client-header {
            text-align: center;
            margin-bottom: 20px;
        }
        .client-title {
            font-size: 28px;
            font-weight: 900;
            color: #ffffff;
        }
        .client-title span {
            color: #ff3da9;
            text-shadow: 0 0 15px rgba(255, 61, 169, 0.5);
        }
        .client-subtitle {
            font-size: 13px;
            color: #a0aec0;
            margin-top: 5px;
        }
        .neon-divider-client {
            height: 2px;
            width: 100%;
            background: linear-gradient(90deg, transparent, #ff239f, transparent);
            margin: 15px 0;
            box-shadow: 0 0 10px rgba(255, 35, 159, 0.4);
        }
    </style>
</head>
<body>
    <div class="client-header">
        <h1 class="client-title">Portal de <span>Comensales</span></h1>
        <p class="client-subtitle">Accede para gestionar tus reservas, ver mesas disponibles y disfrutar de eventos exclusivos.</p>
        <div class="neon-divider-client"></div>
    </div>
</body>
</html>
